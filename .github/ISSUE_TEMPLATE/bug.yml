name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Contracts
        - Swap
        - API
        - Explorer
        - Bridge, swap or claim page
        - LONGYU MINE
        - Chain or RPC
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Add the transaction hash or the address if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit, or the app version shown on the profile page.
