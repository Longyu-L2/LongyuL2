name: Proposal
description: A change to the contracts, the reward rules or a service
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today, and for whom.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks
      description: What could break, and what it means for funds, keys or deployed contracts.
