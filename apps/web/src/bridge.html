<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LONGYU Bridge</title>
    <meta name="description" content="Move {{NATIVE}} between {{L1_NAME}} and LONGYU." />
    <link rel="canonical" href="{{BRIDGE_URL}}/" data-optional="BRIDGE_URL" />
    <meta property="og:url" content="{{BRIDGE_URL}}/" data-optional="BRIDGE_URL" />
    <meta property="og:title" content="LONGYU Bridge" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'" />
    <link rel="preload" href="./Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./Sora-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./app.css" />
    <style>
      .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; max-width: 480px; margin: 0 auto; }
      .trade { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
      .trade .card-head { margin-bottom: 4px; }
      .side { display: grid; gap: 20px; align-content: start; min-width: 0; }
      @media (min-width: 1024px) {
        .layout { max-width: none; grid-template-columns: 460px minmax(0, 1fr); gap: 24px; align-items: start; }
        .trade { position: sticky; top: 88px; }
      }

      .route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
      .net { display: grid; gap: 2px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); }
      .net-label { color: var(--faint); font-weight: 600; font-size: 12px; }
      .net-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .net-name { overflow: hidden; font-weight: 600; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
      .route { align-items: stretch; }
      .route .flip { align-self: center; }
      /* On a phone the two networks stack, the switch between them, as the swap's amounts do. */
      @media (max-width: 479px) {
        .route { grid-template-columns: minmax(0, 1fr); gap: 4px; }
        .net { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 12px; padding: 12px 14px; }
        .net-label { width: 32px; }
        .route .flip { position: relative; z-index: 1; justify-self: end; margin: -22px 16px; }
        body .route .flip svg, body .route .flip:hover:not(:disabled) svg { transform: none; }
      }
      .net-mark { flex: none; width: 20px; height: 20px; border-radius: 50%; }
      .net-mark.l1 { background: url("./bnb.png") center / cover no-repeat; }
      .net-mark.l2 { background: var(--sky) url("./mark.svg") center / 11px 13px no-repeat; }
      .route .flip svg { transform: rotate(-90deg); }
      .route .flip:hover:not(:disabled) svg { transform: rotate(90deg); }

      .assets { flex: none; grid-auto-columns: auto; gap: 4px; }
      .assets button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 6px; border-radius: 18px; font-size: 14px; }
      .assets button::before { content: ""; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 10px/22px var(--sans); text-align: center; }
      #asset-bnb::before { background: url("./bnb.png") center / cover no-repeat; }
      #asset-long::before { background: var(--sky) url("./mark.svg") center / 12px 14px no-repeat; }
      .assets button:disabled::before { opacity: 0.5; }

      .details { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); }

      #history { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
      #history .card-head { margin-bottom: 0; }
      .track { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .track .input input { font-family: var(--mono); font-size: 14px; }
      .track .input input::placeholder { font-family: var(--sans); }
      @media (pointer: coarse) { .track .input input { font-size: 16px; } }
      .track .btn { height: 48px; }
      .wlist { display: grid; margin: 0 -20px -20px; border-top: 1px solid var(--line); }
      .wlist:empty { display: none; }
      .wd { display: grid; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .wd:last-child { border-bottom: 0; }
      .wd-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .wd-amt { flex: 1 1 auto; min-width: 0; overflow: hidden; font: 600 18px/1.3 var(--display); letter-spacing: -0.01em; text-overflow: ellipsis; white-space: nowrap; }
      .wd-state { flex: none; font-weight: 600; font-size: 14px; }
      .wd-top .icon-btn { width: 32px; height: 32px; margin-right: -6px; }
      .wd-top .icon-btn svg { width: 16px; height: 16px; }
      .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .steps li { position: relative; padding-top: 16px; color: var(--faint); font-size: 12px; font-weight: 600; }
      .steps li::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; border-radius: 2px; background: var(--line); }
      .steps li::after { content: ""; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--line-strong); }
      .steps li + li { padding-left: 0; }
      .steps li.done { color: var(--ink); }
      .steps li.done::before { background: var(--blue); }
      .steps li.done::after { background: var(--blue); box-shadow: none; }
      .steps li.now { color: var(--blue-deep); }
      .steps li.now::after { box-shadow: inset 0 0 0 2px var(--blue); }
      .steps.all li.done { color: var(--success); }
      .steps.all li.done::before, .steps.all li.done::after { background: var(--success); }
      .wd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; color: var(--faint); font-size: 13px; }
      .wd-meta a { font-weight: 600; }
      .wd-meta a.mono { color: var(--soft); font-weight: 500; }
      .wd-meta .left { margin-left: auto; color: var(--soft); font-variant-numeric: tabular-nums; }
      .wd-meta .btn { margin-left: auto; }
      .wd .note { color: var(--soft); font-size: 13px; }
      .wd .note:empty { display: none; }
      .wait { color: var(--soft); }
      .ready { color: var(--blue); }
      .done { color: var(--success); }
      .bad { color: var(--danger); }
      @media (max-width: 400px) { .wlist { margin: 0 -16px -16px; } .wd { padding: 16px; } }
    </style>
  </head>
  <body>
    <header class="bar" id="bar">
      <div class="bar-in">
        <a class="bar-home" href="{{HOME_HREF}}" aria-label="LONGYU Network"><img src="./lockup.svg" alt="LONGYU" width="127" height="22" /></a>
        <nav class="bar-nav" id="menu" aria-label="Pages">
          <a href="{{SWAP_HREF}}" data-page="swap.html">Swap</a>
          <a href="{{LAUNCH_HREF}}" data-page="launch.html">Launch</a>
          <a href="{{BRIDGE_HREF}}" aria-current="page">Bridge</a>
          <a href="{{EXPLORER_URL}}/" data-optional="EXPLORER_URL">Explorer<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4" /></svg></a>
        </nav>
        <div class="bar-end">
          <button class="wallet" id="wallet" type="button">Connect wallet</button>
          <button class="toggle" id="menu-button" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="menu" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="bars" d="M4 7h16M4 12h16M4 17h16" /><path class="cross" d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="layout">
        <section class="card trade" id="bridge" aria-label="Bridge">
          <div class="card-head">
            <div class="tabs" role="group" aria-label="Direction">
              <button type="button" class="tab" id="dir-deposit" aria-pressed="true">Deposit</button>
              <button type="button" class="tab" id="dir-withdraw" aria-pressed="false">Withdraw</button>
            </div>
          </div>
          <p class="notice" id="closed" hidden></p>

          <div class="route">
            <div class="net"><span class="net-label">From</span><span class="net-row"><span class="net-mark l1" id="from-mark"></span><span class="net-name" id="from-name">{{L1_SHORT}}</span></span></div>
            <button type="button" class="flip" id="flip-dir" aria-label="Switch direction"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3v13M3.5 12.5 7 16l3.5-3.5M13 17V4M9.5 7.5 13 4l3.5 3.5" /></svg></button>
            <div class="net"><span class="net-label">To</span><span class="net-row"><span class="net-mark l2" id="to-mark"></span><span class="net-name" id="to-name">LONGYU</span></span></div>
          </div>

          <div class="panel">
            <div class="panel-top"><label for="amount">Amount</label></div>
            <div class="panel-mid">
              <input class="amount" id="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0" maxlength="80" />
              <div class="seg assets" role="group" aria-label="Asset">
                <button type="button" id="asset-bnb" aria-pressed="true">{{NATIVE}}</button>
                <button type="button" id="asset-long" aria-pressed="false" data-network="testnet">{{TOKEN}}</button>
                <button type="button" id="asset-long" aria-pressed="false" data-network="mainnet" disabled>{{TOKEN}}</button>
              </div>
            </div>
            <div class="panel-foot"><span class="num">Balance <span id="balance">–</span></span><span id="quick" hidden><button type="button" class="text-btn" data-share="100">Max</button></span></div>
          </div>

          <dl class="details">
            <div><dt>Route</dt><dd id="route">{{L1_NAME}} → LONGYU</dd></div>
            <div id="to-row" hidden><dt>To</dt><dd class="mono" id="to"></dd></div>
            <div id="prove-row" hidden><dt>Ready to prove</dt><dd id="prove-eta">–</dd></div>
            <div id="wait-row" hidden><dt>Then wait</dt><dd id="wait-eta">–</dd></div>
            <div><dt id="eta-label">Time</dt><dd id="eta">–</dd></div>
            <div><dt>Gas</dt><dd id="gas">On {{L1_SHORT}}</dd></div>
          </dl>

          <button type="button" class="btn" id="connect">Connect wallet</button>
          <button type="button" class="btn" id="send" hidden>Deposit</button>
          <div class="status" id="status" role="status"></div>
          <div class="error" id="error" role="alert"></div>
          <a class="tx" id="tx" hidden target="_blank" rel="noopener noreferrer"></a>
          <a class="tx" id="tx2" hidden target="_blank" rel="noopener noreferrer"></a>
        </section>

        <aside class="side" aria-label="Withdrawals">
          <section class="card" id="history">
            <div class="card-head"><h2>Withdrawals</h2><span class="card-sub num" id="w-count"></span></div>
            <div class="track">
              <div class="input"><input id="hash" type="text" autocomplete="off" spellcheck="false" placeholder="LONGYU withdrawal tx hash" aria-label="LONGYU withdrawal transaction hash" maxlength="80" /></div>
              <button type="button" class="btn alt small" id="add">Track</button>
            </div>
            <div class="error" id="track-error"></div>
            <p class="table-empty" id="empty">None yet</p>
            <div class="wlist" id="list"></div>
          </section>
        </aside>
      </div>

      <div class="foot">
        <p data-network="testnet">Testnet tokens have no monetary value.</p>
        <p data-network="mainnet">{{TOKEN}} moves after the TGE.</p>
      </div>
    </main>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
