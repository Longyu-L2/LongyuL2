<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LONGYU Bridge</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'" />
    <style>
      :root { --bg: #F4F9FE; --card: #FFFFFF; --card-high: #EAF2FC; --text: #0A1F3D; --muted: #4B5F7D; --faint: #5F718A; --accent: #0B6FDB; --accent-deep: #0857AD; --on-accent: #FFFFFF; --positive: #0B8058; --danger: #D92D20; --border: rgba(10, 31, 61, 0.12); color-scheme: light; }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
      main { max-width: 560px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
      /* Grid columns may shrink below their content, so nothing can push the page wider than a phone. */
      main, .card, .item { grid-template-columns: minmax(0, 1fr); }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      nav { display: flex; gap: 10px; font-size: 15px; }
      nav a { color: var(--muted); text-decoration: none; padding: 11px 4px; }
      nav a[aria-current="page"] { color: var(--text); }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
      .muted { color: var(--muted); font-size: 14px; }
      .faint { color: var(--faint); font-size: 13px; text-align: center; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .row > :last-child { text-align: right; overflow-wrap: anywhere; min-width: 0; }
      button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
      button:where(:hover:not(:disabled)) { background: var(--accent-deep); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.secondary { background: var(--card-high); color: var(--text); }
      button.link { background: none; color: var(--accent); padding: 10px 0 10px 8px; margin: -10px 0; font-size: 14px; }
      button.x { background: none; color: var(--faint); padding: 0 4px; font-size: 18px; line-height: 1; font-weight: 400; }
      a { color: var(--accent); }
      h1 { display: flex; align-items: center; gap: 12px; font-size: 24px; letter-spacing: -0.02em; margin: 0; }
      h2 { font-size: 16px; font-weight: 600; margin: 0; }
      .seal { height: 28px; width: auto; flex: none; }
      .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card-high); border-radius: 12px; }
      .seg button { background: transparent; color: var(--muted); padding: 10px; font-size: 15px; border-radius: 9px; }
      .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(10, 31, 61, 0.12); }
      .seg button:hover:not(:disabled) { background: none; color: var(--text); }
      input { width: 100%; box-sizing: border-box; background: var(--card-high); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font: inherit; }
      input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
      input:disabled { opacity: 0.5; }
      #amount { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
      #hash { font-size: 14px; }
      /* Phones zoom the page when a focused field's text is under 16px. */
      @media (pointer: coarse) { #hash { font-size: 16px; } }
      .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
      .quick button { background: var(--card-high); color: var(--text); padding: 9px 0; font-size: 14px; border-radius: 10px; }
      .quick button:hover:not(:disabled) { color: var(--accent); }
      .track { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .track button { padding: 0 18px; }
      .num { font-variant-numeric: tabular-nums; }
      .item { border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 6px; }
      .item .amount { font-weight: 600; }
      .item button.act { margin-top: 4px; }
      .wait { color: var(--muted); }
      .ready { color: var(--accent); }
      .done { color: var(--positive); }
      .bad, #error, .err { color: var(--danger); }
      .err:empty, #error:empty, #status:empty, .note:empty { display: none; }
      /* Last, so it wins over the rules above. */
      @media (max-width: 400px) { main { padding: 20px 12px; } .card { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1><img class="seal" src="./mark.svg" alt="" width="23" height="28" />Bridge</h1>
        <nav aria-label="Pages"><a href="./bridge.html" aria-current="page">Bridge</a><a href="./swap.html">Swap</a></nav>
      </header>
      <section class="card" id="bridge">
        <div class="muted" id="closed" hidden></div>
        <div class="seg" role="group" aria-label="Direction">
          <button type="button" id="dir-deposit" aria-pressed="true">Deposit</button>
          <button type="button" id="dir-withdraw" aria-pressed="false">Withdraw</button>
        </div>
        <div class="seg" role="group" aria-label="Asset">
          <button type="button" id="asset-bnb" aria-pressed="true">tBNB</button>
          <button type="button" id="asset-long" aria-pressed="false">tLONG</button>
        </div>
        <div class="row"><span class="muted">Route</span><span id="route">BSC Testnet → LONGYU</span></div>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.0" aria-label="Amount" maxlength="80" />
        <div class="quick" role="group" aria-label="Share of balance" id="quick" hidden>
          <button type="button" data-share="25">25%</button>
          <button type="button" data-share="50">50%</button>
          <button type="button" data-share="75">75%</button>
          <button type="button" data-share="100">Max</button>
        </div>
        <div class="row"><span class="muted">Balance</span><span class="num" id="balance">–</span></div>
        <div class="row" id="to-row" hidden><span class="muted">To</span><span class="num" id="to"></span></div>
        <div class="row"><span class="muted">Time</span><span id="eta">–</span></div>
        <button type="button" id="connect">Connect wallet</button>
        <button type="button" id="send" hidden>Deposit</button>
        <a id="tx" hidden target="_blank" rel="noopener noreferrer"></a>
        <a id="tx2" hidden target="_blank" rel="noopener noreferrer"></a>
        <div class="muted" id="status"></div>
        <div id="error"></div>
      </section>
      <section class="card" id="history">
        <h2>Withdrawals</h2>
        <div class="track">
          <input id="hash" type="text" autocomplete="off" spellcheck="false" placeholder="LONGYU tx hash" aria-label="LONGYU withdrawal transaction hash" maxlength="80" />
          <button type="button" class="secondary" id="add">Track</button>
        </div>
        <div class="err" id="track-error"></div>
        <div id="list"></div>
        <div class="faint" id="empty">None yet</div>
      </section>
      <p class="muted faint">Testnet tokens have no monetary value.</p>
    </main>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
