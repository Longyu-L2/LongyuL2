<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LONGYU Swap</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'" />
    <style>
      :root { --bg: #F4F9FE; --card: #FFFFFF; --card-high: #EAF2FC; --text: #0A1F3D; --muted: #4B5F7D; --faint: #5F718A; --accent: #0B6FDB; --accent-deep: #0857AD; --on-accent: #FFFFFF; --positive: #0B8058; --danger: #D92D20; --border: rgba(10, 31, 61, 0.12); color-scheme: light; }
      [hidden] { display: none !important; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
      main { max-width: 560px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
      /* Grid columns may shrink below their content, so nothing can push the page wider than a phone. */
      main, .card, .box, .grid { grid-template-columns: minmax(0, 1fr); }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      nav { display: flex; gap: 10px; font-size: 15px; }
      nav a { color: var(--muted); text-decoration: none; padding: 11px 4px; }
      nav a[aria-current="page"] { color: var(--text); }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
      .muted { color: var(--muted); font-size: 14px; }
      .faint { color: var(--faint); font-size: 13px; text-align: center; }
      p { margin: 0; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .row > :last-child { text-align: right; overflow-wrap: anywhere; min-width: 0; }
      button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
      button:where(:hover:not(:disabled)) { background: var(--accent-deep); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.link { background: none; color: var(--accent); padding: 10px 0 10px 8px; margin: -10px 0; font-size: 14px; }
      a { color: var(--accent); }
      h1 { display: flex; align-items: center; gap: 12px; font-size: 24px; letter-spacing: -0.02em; margin: 0; }
      .seal { height: 28px; width: auto; flex: none; }
      .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--card-high); border-radius: 12px; }
      .seg button { background: transparent; color: var(--muted); padding: 10px; font-size: 15px; border-radius: 9px; }
      .seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(10, 31, 61, 0.12); }
      .seg button:hover:not(:disabled) { background: none; color: var(--text); }
      .seg.small { padding: 3px; border-radius: 10px; }
      .seg.small { flex: none; }
      .seg.small button { padding: 8px 10px; font-size: 13px; border-radius: 7px; white-space: nowrap; }
      .box { background: var(--card-high); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
      .box:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
      .field { display: flex; align-items: baseline; gap: 12px; }
      .field input { flex: 1 1 0; width: 0; min-width: 0; background: none; color: var(--text); border: 0; padding: 0; font: inherit; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .field input:focus { outline: none; }
      .field input:disabled { opacity: 0.5; }
      .field input[readonly] { color: var(--muted); }
      .token { font-weight: 600; }
      .quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
      .quick button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 7px 0; font-size: 13px; border-radius: 9px; }
      .quick button:hover:not(:disabled) { color: var(--accent); }
      .flip { justify-self: center; width: 36px; height: 36px; padding: 0; margin: -22px 0; border-radius: 50%; background: var(--card); color: var(--accent); border: 1px solid var(--border); font-size: 18px; line-height: 1; position: relative; }
      .num { font-variant-numeric: tabular-nums; }
      .bad, #error { color: var(--danger); }
      #error:empty, #status:empty, #note:empty { display: none; }
      /* Last, so it wins over the rules above. */
      @media (max-width: 400px) { main { padding: 20px 12px; } .card { padding: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1><img class="seal" src="./mark.svg" alt="" width="23" height="28" />Swap</h1>
        <nav aria-label="Pages"><a href="./bridge.html">Bridge</a><a href="./swap.html" aria-current="page">Swap</a></nav>
      </header>
      <section class="card" id="swap">
        <div class="muted" id="closed" hidden></div>
        <div class="seg" role="group" aria-label="Action">
          <button type="button" id="mode-swap" aria-pressed="true">Swap</button>
          <button type="button" id="mode-add" aria-pressed="false">Add</button>
          <button type="button" id="mode-remove" aria-pressed="false">Remove</button>
        </div>
        <div id="boxes" class="grid" style="display: grid; gap: 12px">
          <div class="box">
            <div class="row"><span class="muted" id="a-label">You pay</span><span class="muted num" id="a-balance">–</span></div>
            <div class="field"><input id="a" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.0" aria-labelledby="a-label a-token" maxlength="80" /><span class="token" id="a-token">{{NATIVE}}</span></div>
            <div class="quick" role="group" aria-label="Share of balance" id="a-quick" hidden>
              <button type="button" data-share="25">25%</button>
              <button type="button" data-share="50">50%</button>
              <button type="button" data-share="75">75%</button>
              <button type="button" data-share="100">Max</button>
            </div>
          </div>
          <button type="button" class="flip" id="flip" aria-label="Switch direction">↓</button>
          <div class="box">
            <div class="row"><span class="muted" id="b-label">You receive</span><span class="muted num" id="b-balance">–</span></div>
            <div class="field"><input id="b" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="0.0" aria-labelledby="b-label b-token" maxlength="80" /><span class="token" id="b-token">{{TOKEN}}</span></div>
            <div class="quick" role="group" aria-label="Share of balance" id="b-quick" hidden>
              <button type="button" data-share="25">25%</button>
              <button type="button" data-share="50">50%</button>
              <button type="button" data-share="75">75%</button>
              <button type="button" data-share="100">Max</button>
            </div>
          </div>
        </div>
        <div class="seg" role="group" aria-label="Share to remove" id="percent" hidden>
          <button type="button" data-percent="25" aria-pressed="false">25%</button>
          <button type="button" data-percent="50" aria-pressed="false">50%</button>
          <button type="button" data-percent="75" aria-pressed="false">75%</button>
          <button type="button" data-percent="100" aria-pressed="true">100%</button>
        </div>
        <div class="row" id="mine-row" hidden><span class="muted">Your liquidity</span><span class="num" id="mine">–</span></div>
        <div class="row" id="out-row" hidden><span class="muted">You receive</span><span class="num" id="out">–</span></div>
        <div class="row" id="rate-row"><span class="muted">Rate</span><span class="num" id="rate">–</span></div>
        <div class="row" id="impact-row"><span class="muted">Price impact</span><span class="num" id="impact">–</span></div>
        <div class="row" id="min-row"><span class="muted">Minimum</span><span class="num" id="min">–</span></div>
        <div class="row" id="pool-row" hidden><span class="muted">Pool</span><span class="num" id="pool">–</span></div>
        <div class="row" style="align-items: center">
          <span class="muted" style="white-space: nowrap">Max slippage</span>
          <span class="seg small" role="group" aria-label="Max slippage" id="slippage"></span>
        </div>
        <div class="muted" id="note"></div>
        <button type="button" id="connect">Connect wallet</button>
        <button type="button" id="send" hidden>Swap</button>
        <a id="tx" hidden target="_blank" rel="noopener noreferrer"></a>
        <div class="muted" id="status"></div>
        <div id="error"></div>
      </section>
      <p class="faint"><button type="button" class="link" id="watch" style="padding: 10px 8px">Add {{TOKEN}} to wallet</button></p>
      <p class="muted faint" data-network="testnet">Testnet tokens have no monetary value. 0.3% pool fee.</p>
      <p class="muted faint" data-network="mainnet">0.3% pool fee.</p>
    </main>
    <script type="module" src="./swap.js"></script>
  </body>
</html>
