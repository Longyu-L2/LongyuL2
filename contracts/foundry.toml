[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# opBNB-based chains and BSC both support Cancun opcodes; nothing newer is used.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fmt]
line_length = 110
